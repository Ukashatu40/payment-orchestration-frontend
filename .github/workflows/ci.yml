name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backend repo's committed OpenAPI spec; override with a repo variable
  # (e.g. a staging /api/docs-json URL) if the backend moves or forks.
  OPENAPI_SPEC: ${{ vars.OPENAPI_SPEC_URL || 'https://raw.githubusercontent.com/Ukashatu40/payflow-orchestration-engine/main/docs/api-specification.yaml' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-client-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate API client from backend spec
        run: pnpm api-client:generate
      - name: Fail on uncommitted generated diff
        run: git diff --exit-code -- packages/api-client/src/generated

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        app: [ops, merchant-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @payflow/${{ matrix.app }} exec playwright install --with-deps chromium
      - run: pnpm --filter @payflow/${{ matrix.app }} build
      - run: pnpm --filter @payflow/${{ matrix.app }} test:e2e
        env:
          CI: "true"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --audit-level=high
